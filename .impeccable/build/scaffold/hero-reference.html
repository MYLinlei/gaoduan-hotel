<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Scaffold reference: homepage-comp-b.png</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kalnia+Glaze:wght@400&display=swap">
  <link rel="stylesheet" href="layout.css">
  <style>html,body{margin:0}body{background:#f7f6f5}.region{box-sizing:border-box}.region.text p{white-space:pre-wrap}</style>
</head>
<body>
<!-- Reference only. Every region sits at its measured box inside a comp-aspect frame. Take the boxes (layout.css), keep your own semantic structure. -->
<main class="comp-frame" style="max-width:1505px">
  <div class="r-service-strip region chrome" data-region="service-strip"><!-- slim warm-gray service strip --></div>
  <div class="r-global-header region chrome" data-region="global-header"><!-- white brand, search and commerce navigation --></div>
  <div class="r-brand-mark region text" data-region="brand-mark"><!-- serif 筑家优选 wordmark with small descriptor --><p style="font-size:var(--r-brand-mark-font);line-height:1.05;margin:0">brand-mark</p></div>
  <div class="r-global-search region control" data-region="global-search"><!-- wide bordered product search: rebuild the control's chrome from the crop (comp-spec.mjs --crop global-search); its ink box, border, fill, radius, and label size are the comp's --></div>
  <figure class="r-hero-space region plate" data-region="hero-space"><img src="../../../assets/plates/hero-space.png" alt="" style="width:100%;height:100%;object-fit:contain;object-position:top left"></figure>
  <div class="r-hero-heading region text" data-region="hero-heading"><!-- large two-line serif heading --><p style="font-size:var(--r-hero-heading-font);font-family:var(--r-hero-heading-family),sans-serif;font-weight:var(--r-hero-heading-weight);line-height:1.05;margin:0">hero-heading</p></div>
  <div class="r-hero-copy region text" data-region="hero-copy"><!-- short explanatory body copy --><p style="line-height:1.05;margin:0">hero-copy</p></div>
  <div class="r-hero-search region control" data-region="hero-search"><!-- secondary material search: rebuild the control's chrome from the crop (comp-spec.mjs --crop hero-search); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-hero-action region control" data-region="hero-action"><!-- full-width terracotta action: rebuild the control's chrome from the crop (comp-spec.mjs --crop hero-action); its ink box, border, fill, radius, and label size are the comp's --></div>
  <figure class="r-tile-product region plate" data-region="tile-product"><img src="../../../assets/plates/tile-product.png" alt="" style="width:100%;height:100%;object-fit:contain;object-position:top left"></figure>
  <figure class="r-bath-product region plate" data-region="bath-product"><img src="../../../assets/plates/bath-product.png" alt="" style="width:100%;height:100%;object-fit:contain;object-position:top left"></figure>
  <figure class="r-floor-product region plate" data-region="floor-product"><img src="../../../assets/plates/floor-product.png" alt="" style="width:100%;height:100%;object-fit:contain;object-position:top left"></figure>
  <figure class="r-cabinet-product region plate" data-region="cabinet-product"><img src="../../../assets/plates/cabinet-product.png" alt="" style="width:100%;height:100%;object-fit:contain;object-position:top left"></figure>
  <div class="r-category-index region chrome" data-region="category-index"><!-- four-column architectural material index --></div>
  <div class="r-coupon-preview region chrome" data-region="coupon-preview"><!-- coupon section beginning --></div>
  <div class="r-ranking-preview region chrome" data-region="ranking-preview"><!-- hot ranking section beginning --></div>
</main>
</body>
</html>
