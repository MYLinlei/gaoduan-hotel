server:
  port: ${SERVER_PORT:8081}

spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  ai:
    dashscope:
      # The SDK requires a non-empty value even when remote AI is disabled.
      api-key: ${AI_DASHSCOPE_API_KEY:local-disabled-key}
      chat:
        options:
          model: qwen-plus
  main:
    allow-circular-references: true
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: ${sky.datasource.driver-class-name}
    url: jdbc:mysql://${sky.datasource.host}:${sky.datasource.port}/${sky.datasource.database}?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf-8&zeroDateTimeBehavior=convertToNull&useSSL=false&allowPublicKeyRetrieval=true
    username: ${sky.datasource.username}
    password: ${sky.datasource.password}
  redis:
    host: ${sky.redis.host}
    port: ${sky.redis.port}
    database: ${sky.redis.database}
    password: ${sky.redis.password:}

mybatis:
  #mapper配置文件
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.sky.entity
  configuration:
    #开启驼峰命名
    map-underscore-to-camel-case: true

logging:
  level:
    com:
      sky:
        mapper: debug
        service: info
        controller: info

sky:
  ai:
    remote-enabled: ${AI_REMOTE_ENABLED:false}
  jwt:
    admin-secret-key: ${JWT_ADMIN_SECRET}
    admin-ttl: ${JWT_ADMIN_TTL:7200000}
    admin-token-name: ${JWT_ADMIN_TOKEN_NAME:token}
    user-secret-key: ${JWT_USER_SECRET}
    user-ttl: ${JWT_USER_TTL:7200000}
    user-token-name: ${JWT_USER_TOKEN_NAME:authentication}
  wechat:
    appid: ${sky.wechat.appid:}
    secret: ${sky.wechat.secret:}
