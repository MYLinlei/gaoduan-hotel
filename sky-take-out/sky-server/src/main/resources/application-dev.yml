spring:
  config:
    # IDEA's default run action uses the dev profile. If a Git-ignored local
    # configuration exists, load it automatically as the machine-local override.
    import: optional:classpath:application-local.yml

sky:
  order:
    payment-timeout-minutes: ${ORDER_PAYMENT_TIMEOUT_MINUTES:15}
    timeout-scan-enabled: ${ORDER_TIMEOUT_SCAN_ENABLED:true}
    timeout-scan-initial-delay-ms: ${ORDER_TIMEOUT_SCAN_INITIAL_DELAY_MS:60000}
    timeout-scan-interval-ms: ${ORDER_TIMEOUT_SCAN_INTERVAL_MS:60000}
  sms:
    # 仅开发环境输出验证码，便于 IDEA 本地联调；prod Profile 不启用。
    log-code: ${SMS_LOG_CODE:true}
  upload-dir: ${UPLOAD_DIR:./uploads}
  file-host: ${FILE_HOST:http://localhost:8081}
  datasource:
    driver-class-name: ${DB_DRIVER:com.mysql.cj.jdbc.Driver}
    host: ${DB_HOST:localhost}
    port: ${DB_PORT:3306}
    database: ${DB_NAME:sky_take_out}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
  redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
    database: ${REDIS_DATABASE:0}
    password: ${REDIS_PASSWORD:}
  wechat:
    appid: ${WECHAT_APP_ID:}
    secret: ${WECHAT_SECRET:}
