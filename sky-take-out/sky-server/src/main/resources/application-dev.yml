spring:
  config:
    # IDEA's default run action uses the dev profile. If a Git-ignored local
    # configuration exists, load it automatically as the machine-local override.
    import: optional:classpath:application-local.yml

sky:
  upload-dir: ${UPLOAD_DIR:./uploads}
  file-host: ${FILE_HOST:http://localhost:8081}
  datasource:
    driver-class-name: ${DB_DRIVER:com.mysql.cj.jdbc.Driver}
    host: ${DB_HOST:localhost}
    port: ${DB_PORT:3306}
    database: ${DB_NAME:sky_take_out}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
  redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
    database: ${REDIS_DATABASE:0}
    password: ${REDIS_PASSWORD:}
  wechat:
    appid: ${WECHAT_APP_ID:}
    secret: ${WECHAT_SECRET:}
